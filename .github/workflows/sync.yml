name: Sync Patreon Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Clone target repo
        run: |
          git clone "https://x-access-token:${{ secrets.PATREON_TARGET_TOKEN }}@github.com/${{ secrets.PATREON_TARGET_REPO }}.git" content

      - name: Write config.json
        env:
          SYNC_CONFIG_B64: ${{ secrets.SYNC_CONFIG_B64 }}
        run: |
          printf '%s' "$SYNC_CONFIG_B64" | base64 --decode > config.json

      - name: Install dependencies
        run: bun install

      - name: Sync Patreon content
        run: bun run sync:patreon

      - name: Push content to target repo
        run: |
          cd content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "Sync Patreon content"
          git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    if: github.repository == 'noaione/second-draft'
    permissions:
      id-token: write # This is required for the Tailscale action to request a JWT from GitHub
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Pull latest content on server
        run: |
          tailscale ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} "cd /opt/second-draft/content && git pull"
